<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc">
  <title id="title">Build boldly. Stay curious. Ship with care.</title>
  <desc id="desc">Midnight card with an animated neon signal sweep, closing the Aryan Garg developer profile.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1018"/><stop offset=".55" stop-color="#111421"/><stop offset="1" stop-color="#151023"/></linearGradient><linearGradient id="beam"><stop stop-color="#b9ff66"/><stop offset=".5" stop-color="#56ead0"/><stop offset="1" stop-color="#b58aff"/></linearGradient></defs>
  <rect width="1200" height="112" rx="22" fill="url(#bg)" stroke="#323a4c"/>
  <path d="M38 22H1162" stroke="#293246"/>
  <path d="M-80 22H210" stroke="url(#beam)" stroke-width="2"><animate attributeName="d" values="M-80 22H210;M990 22H1280;M-80 22H210" dur="7s" repeatCount="indefinite"/></path>
  <text x="600" y="67" text-anchor="middle" fill="#e7ecf6" font-family="Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="2">BUILD BOLDLY<tspan fill="#b9ff66">　/　</tspan>STAY CURIOUS<tspan fill="#56ead0">　/　</tspan>SHIP WITH CARE</text>
  <text x="600" y="91" text-anchor="middle" fill="#72809a" font-family="Consolas,monospace" font-size="10" letter-spacing="2">ARYAN GARG　·　STRIKERFR</text>
</svg>
