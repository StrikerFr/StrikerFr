<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Garg — product-minded software developer</title>
  <desc id="desc">A dark, electric violet and acid-lime developer banner. A glowing code terminal and orbiting signal lines frame Aryan Garg's name and focus on products, AI, and open source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080a12"/><stop offset=".48" stop-color="#101421"/><stop offset="1" stop-color="#171023"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#b9ff66"/><stop offset=".52" stop-color="#56ead0"/><stop offset="1" stop-color="#b58aff"/></linearGradient>
    <linearGradient id="type" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#b9c4dc"/></linearGradient>
    <radialGradient id="flare"><stop stop-color="#a46bff" stop-opacity=".27"/><stop offset="1" stop-color="#a46bff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b4c3e6" stroke-opacity=".055"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="968" cy="200" rx="300" ry="240" fill="url(#flare)" filter="url(#blur)"/>
  <g fill="none" stroke="url(#beam)" opacity=".72">
    <path d="M582 352C716 330 683 229 827 211s99-137 245-160" stroke-width="1.5" stroke-dasharray="4 9"><animate attributeName="stroke-dashoffset" values="0;-52" dur="5s" repeatCount="indefinite"/></path>
    <path d="M570 373C744 347 703 254 851 238s111-122 268-143" opacity=".45"/><path d="M604 394C780 370 740 278 878 267s125-104 270-115" opacity=".24"/>
    <circle cx="825" cy="211" r="5" fill="#b9ff66" stroke="none" filter="url(#glow)"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1072" cy="52" r="3" fill="#56ead0" stroke="none"><animate attributeName="opacity" values=".4;1;.4" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g opacity=".8">
    <rect x="818" y="124" width="300" height="188" rx="15" fill="#0b0e18" fill-opacity=".78" stroke="#7989ac" stroke-opacity=".2"/>
    <path d="M818 159h300" stroke="#7989ac" stroke-opacity=".18"/>
    <circle cx="841" cy="142" r="4" fill="#ff7085"/><circle cx="857" cy="142" r="4" fill="#ffca6a"/><circle cx="873" cy="142" r="4" fill="#b9ff66"/>
    <text x="842" y="192" fill="#a58aff" font-family="Consolas,monospace" font-size="14">const</text><text x="886" y="192" fill="#56ead0" font-family="Consolas,monospace" font-size="14">nextIdea</text><text x="966" y="192" fill="#c5d0e4" font-family="Consolas,monospace" font-size="14">=</text>
    <text x="842" y="219" fill="#b9ff66" font-family="Consolas,monospace" font-size="14">buildSomething</text><text x="960" y="219" fill="#c5d0e4" font-family="Consolas,monospace" font-size="14">(real);</text>
    <path d="M842 245h215" stroke="#77839d" stroke-opacity=".25"/><path d="M842 267h166" stroke="#77839d" stroke-opacity=".2"/><path d="M842 289h191" stroke="#77839d" stroke-opacity=".2"/>
  </g>
  <path d="M76 87h48" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>
  <text x="76" y="122" fill="#9aa8c3" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">PRODUCT-MINDED DEVELOPER　/　INDIA</text>
  <text x="68" y="224" fill="url(#type)" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="-3">Aryan Garg</text>
  <text x="78" y="269" fill="#d3d9e8" font-family="Arial,sans-serif" font-size="21">I turn ambitious ideas into software people can use.</text>
  <g font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1.5">
    <rect x="77" y="307" width="136" height="30" rx="15" fill="#b9ff66" fill-opacity=".09" stroke="#b9ff66" stroke-opacity=".45"/><text x="145" y="326" fill="#c8ff8b" text-anchor="middle">FULL-STACK</text>
    <rect x="222" y="307" width="135" height="30" rx="15" fill="#56ead0" fill-opacity=".08" stroke="#56ead0" stroke-opacity=".4"/><text x="289" y="326" fill="#8af3de" text-anchor="middle">AI PRODUCTS</text>
    <rect x="366" y="307" width="140" height="30" rx="15" fill="#b58aff" fill-opacity=".1" stroke="#b58aff" stroke-opacity=".42"/><text x="436" y="326" fill="#c7aaff" text-anchor="middle">OPEN SOURCE</text>
  </g>
  <text x="78" y="383" fill="#6f7e99" font-family="Consolas,monospace" font-size="12" letter-spacing="2">CS UNDERGRAD　·　IDEATE → BUILD → SHIP</text>
</svg>
